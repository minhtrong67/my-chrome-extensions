<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Image Downloader</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
<main class="page">
  <header class="head">
    <img src="../icons/icon48.png" width="40" height="40" alt="">
    <div>
      <h1>Discord Image Downloader</h1>
      <p class="muted" data-i18n="optSubtitle">Settings</p>
    </div>
    <span id="saved" class="saved" aria-live="polite"></span>
  </header>

  <div class="infobar" role="note">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span data-i18n="tip"></span>
  </div>

  <section>
    <h2 data-i18n="grpAppearance"></h2>

    <div class="card">
      <svg class="ico lead" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      <div class="text"><div class="name" data-i18n="language"></div><div class="desc muted" data-i18n="languageDesc"></div></div>
      <select id="language" class="combo">
        <option value="auto" data-i18n="auto"></option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </div>

    <div class="card">
      <svg class="ico lead" viewBox="0 0 24 24"><path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/></svg>
      <div class="text"><div class="name" data-i18n="theme"></div><div class="desc muted" data-i18n="themeDesc"></div></div>
      <select id="theme" class="combo">
        <option value="system" data-i18n="system"></option>
        <option value="light" data-i18n="light"></option>
        <option value="dark" data-i18n="dark"></option>
      </select>
    </div>
  </section>

  <section>
    <h2 data-i18n="grpDownloads"></h2>

    <div class="card">
      <svg class="ico lead" viewBox="0 0 24 24"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>
      <div class="text"><div class="name" data-i18n="includeEmbeds"></div><div class="desc muted" data-i18n="includeEmbedsDesc"></div></div>
      <label class="switch"><span class="state" data-for="includeEmbeds"></span>
        <input type="checkbox" role="switch" id="includeEmbeds"><span class="track"></span></label>
    </div>

    <div class="card">
      <svg class="ico lead" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
      <div class="text"><div class="name" data-i18n="showToast"></div><div class="desc muted" data-i18n="showToastDesc"></div></div>
      <label class="switch"><span class="state" data-for="showToast"></span>
        <input type="checkbox" role="switch" id="showToast"><span class="track"></span></label>
    </div>

    <div class="card">
      <svg class="ico lead" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>
      <div class="text"><div class="name" data-i18n="subfolder"></div><div class="desc muted" data-i18n="subfolderDesc"></div></div>
      <input id="subfolder" class="input short" type="text" spellcheck="false" autocomplete="off" placeholder="Discord">
    </div>

    <div class="card column">
      <div class="row">
        <svg class="ico lead" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <div class="text"><div class="name" data-i18n="template"></div><div class="desc muted" data-i18n="templateDesc"></div></div>
      </div>
      <input id="template" class="input" type="text" spellcheck="false" autocomplete="off">
      <div class="chips" role="group" aria-label="Tokens">
        <span class="muted" data-i18n="insert"></span>
        <button type="button" class="chip" data-token="{user}">{user}</button>
        <button type="button" class="chip" data-token="{date}">{date}</button>
        <button type="button" class="chip" data-token="{time}">{time}</button>
        <button type="button" class="chip" data-token="{index}">{index}</button>
        <button type="button" class="chip" data-token="{name}">{name}</button>
        <button type="button" class="chip" data-token="{messageId}">{messageId}</button>
      </div>
      <div class="preview"><span class="muted" data-i18n="preview"></span><code id="preview"></code></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="grpAbout"></h2>
    <div class="card">
      <div class="text"><div class="name" data-i18n="author"></div><div class="desc muted" data-i18n="aiCredit"></div></div>
      <span class="value">minhtrong67</span>
    </div>
    <div class="card">
      <div class="text"><div class="name" data-i18n="version"></div></div>
      <span class="value" id="version"></span>
    </div>
  </section>

  <footer class="foot">
    <button type="button" id="restore" class="button" data-i18n="restore"></button>
  </footer>
</main>
<script src="../shared/common.js"></script>
<script src="options.js"></script>
</body>
</html>
