<style>
:root{--bg:#fafaf9;--sf:#fff;--sub:#f3f3f1;--bd:#e5e5e2;--tx:#171717;--tx2:#52525b;--tx3:#71717a;--ac:#0f766e;--acx:#fff;--ach:#115e59;--r:8px;--ease:cubic-bezier(.2,.7,.2,1);
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
[data-theme=dark]{--bg:#0d0d0e;--sf:#151517;--sub:#1c1c1f;--bd:#27272a;--tx:#f4f4f5;--tx2:#a1a1aa;--tx3:#8b8b94;--ac:#5eead4;--acx:#042f2e;--ach:#99f6e4;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px;-webkit-text-size-adjust:100%}
html.theming *{transition:background-color .3s,border-color .3s,color .3s!important}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code,kbd{font-family:var(--mono);font-size:.88em}
p{color:var(--tx2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
[data-lucide]{width:18px;height:18px;stroke-width:1.75;flex:none}
svg.lucide{width:18px;height:18px;flex:none}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 max(1.25rem,env(safe-area-inset-left))}
section{padding:5.5rem 0 0}
h2{font-size:clamp(1.5rem,3vw,1.9rem);font-weight:650;letter-spacing:-.02em;line-height:1.2}
.lead{max-width:52ch;margin-top:.6rem}

/* header */
.hdr{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:1.5rem;height:60px}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:650;letter-spacing:-.01em}
.brand i,.brand svg{color:var(--ac)}
.nav{display:flex;gap:.25rem;margin-left:auto}
.nav a{padding:.4rem .75rem;border-radius:var(--r);font-size:.92rem;color:var(--tx2);transition:color .2s,background .2s}
.nav a:hover{color:var(--tx);background:var(--sub)}
.ctl{display:flex;align-items:center;gap:.5rem}
.seg{display:flex;padding:2px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sub)}
.seg button{display:grid;place-items:center;min-width:30px;height:28px;padding:0 .45rem;border-radius:6px;color:var(--tx3);font-size:.78rem;font-weight:600;transition:background .25s var(--ease),color .2s,box-shadow .25s}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r);color:var(--tx2);transition:background .2s,color .2s}
.ib:hover{background:var(--sub);color:var(--tx)}
.menu-btn{display:none}
.menu-btn .x,.menu-btn[aria-expanded=true] .m{display:none}
.menu-btn[aria-expanded=true] .x{display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;height:42px;padding:0 1.1rem;border-radius:var(--r);font-weight:550;font-size:.95rem;border:1px solid var(--bd);transition:transform .2s var(--ease),background .2s,border-color .2s}
.btn:hover{border-color:var(--tx3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.pri:hover{background:var(--ach);border-color:var(--ach)}

/* hero */
.hero>*{animation:rise .7s var(--ease) both}
.hero>:nth-child(2){animation-delay:.08s}.hero>:nth-child(3){animation-delay:.16s}.hero>:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero h1{font-size:clamp(2.2rem,6.2vw,4.1rem);font-weight:700;letter-spacing:-.035em;line-height:1.06;max-width:17ch}
.hero .sub{font-size:1.15rem;max-width:50ch;margin-top:1.4rem}
.acts{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem}
.facts{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--bd);font-size:.9rem;color:var(--tx3)}
.facts b{color:var(--tx);font-weight:600}

/* extension list */
.tools{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin:2rem 0 .5rem}
.tabs{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;margin:0 -.25rem}
.tabs button{position:relative;padding:.45rem .75rem;font-size:.92rem;color:var(--tx3);white-space:nowrap;transition:color .2s}
.tabs button::after{content:"";position:absolute;left:.75rem;right:.75rem;bottom:0;height:2px;background:var(--ac);transform:scaleX(0);transition:transform .3s var(--ease)}
.tabs button:hover{color:var(--tx)}
.tabs button[aria-pressed=true]{color:var(--tx);font-weight:600}
.tabs button[aria-pressed=true]::after{transform:scaleX(1)}
.search{position:relative;flex:0 1 280px;width:100%}
.search i,.search svg{position:absolute;left:.75rem;top:50%;translate:0 -50%;color:var(--tx3);pointer-events:none}
.search input{width:100%;height:40px;padding:0 .8rem 0 2.5rem;font:inherit;font-size:.92rem;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.list{border-top:1px solid var(--bd)}
.row{display:grid;grid-template-columns:44px 1fr auto 20px;align-items:center;gap:1rem;width:100%;padding:1.1rem .5rem;text-align:left;border-bottom:1px solid var(--bd);animation:fade .45s var(--ease) both;animation-delay:calc(var(--i)*35ms);transition:background .25s,padding .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.row:hover{background:var(--sub);padding-left:1rem;padding-right:1rem}
.row:hover .go{transform:translateX(3px);color:var(--tx)}
.ico{width:44px;height:44px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);display:grid;place-items:center;overflow:hidden}
.ico img{width:28px;height:28px;object-fit:contain}
.nm{font-weight:600;display:flex;align-items:baseline;gap:.6rem}
.nm small{font-family:var(--mono);font-size:.74rem;color:var(--tx3);font-weight:400}
.ds{font-size:.92rem;color:var(--tx2);margin-top:.15rem;max-width:68ch}
kbd{padding:.2rem .5rem;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx2);white-space:nowrap}
.go{color:var(--tx3);transition:transform .25s var(--ease),color .2s}
.empty{display:none;padding:3rem 0;text-align:center}
.empty.on{display:block}
.empty b{display:block;color:var(--tx);margin-bottom:.25rem}

/* principles */
.pr{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem 3.5rem;margin-top:2.5rem}
.pr i,.pr svg{color:var(--ac);margin-bottom:.7rem}
.pr h3{font-size:1.05rem;font-weight:600;margin-bottom:.3rem}

/* install */
.ins{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2.5rem;align-items:start}
ol{list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:0 0 1.5rem 2.6rem}
ol li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--tx2)}
ol li::after{content:"";position:absolute;left:13.5px;top:34px;bottom:6px;width:1px;background:var(--bd)}
ol li:last-child::after{display:none}
ol h3{font-size:1rem;font-weight:600}
ol p{font-size:.93rem}
p code,.cmd code{background:var(--sub);padding:.1rem .35rem;border-radius:4px}
.cmd{position:sticky;top:84px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);overflow:hidden}
.cmd-h{padding:.6rem 1rem;border-bottom:1px solid var(--bd);font-size:.8rem;color:var(--tx3)}
.cmd-b{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem}
.cmd-b code{background:none;padding:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cp{display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 .7rem;border:1px solid var(--bd);border-radius:6px;font-size:.82rem;color:var(--tx2);transition:color .2s,border-color .2s}
.cp:hover{color:var(--tx);border-color:var(--tx3)}
.cp.ok{color:var(--ac);border-color:var(--ac)}
.tip{padding:0 1rem 1rem;font-size:.88rem}

/* faq */
.faq{margin-top:2rem;border-top:1px solid var(--bd);max-width:760px}
.q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 0;text-align:left;font-weight:550}
.q svg{color:var(--tx3);transition:transform .35s var(--ease)}
.fi{border-bottom:1px solid var(--bd)}
.fi.open .q svg{transform:rotate(180deg)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.a>div{overflow:hidden}
.a p{padding-bottom:1.1rem;max-width:62ch}
.fi.open .a{grid-template-rows:1fr}

/* author + footer */
.au{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;padding:2rem;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.au img{width:72px;height:72px;border-radius:50%;border:1px solid var(--bd);background:var(--sub)}
.au>div{flex:1;min-width:240px}
.au h2{font-size:1.25rem}
.links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
footer{margin-top:5.5rem;border-top:1px solid var(--bd);padding:1.75rem 0 calc(1.75rem + env(safe-area-inset-bottom));font-size:.88rem;color:var(--tx3)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem}
footer a:hover{color:var(--tx)}

/* dialog */
dialog{margin:auto;width:min(720px,calc(100% - 1.5rem));max-height:calc(100dvh - 2rem);padding:0;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);box-shadow:0 24px 60px rgb(0 0 0/.25);overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .32s var(--ease)}
dialog[open]::backdrop{background:rgb(10 10 10/.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeb .3s}
dialog.closing{animation:out .18s ease forwards}
dialog.closing::backdrop{animation:fadeb .18s reverse forwards}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes out{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes fadeb{from{opacity:0}}
.dh{display:flex;align-items:center;gap:1rem;padding:1.25rem 1.25rem 1rem}
.dh h3{font-size:1.2rem;font-weight:650;line-height:1.2}
.dh p{font-size:.9rem}
.dh .ib{margin-left:auto}
.db{overflow-y:auto;padding:0 1.25rem 1.25rem}
.shots{display:flex;gap:.6rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:1rem 0 1.25rem;padding-bottom:.4rem}
.shots img{height:190px;width:auto;max-width:none;border:1px solid var(--bd);border-radius:8px;scroll-snap-align:start;background:var(--sub)}
.db h4{font-size:.9rem;font-weight:600;margin:1.25rem 0 .6rem}
.ft{list-style:none;display:grid;gap:.5rem}
.ft li{display:flex;gap:.6rem;font-size:.93rem;color:var(--tx2)}
.ft svg{color:var(--ac);margin-top:.2rem;width:16px;height:16px}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;padding:1rem;border:1px solid var(--bd);border-radius:10px;font-size:.88rem}
.sp span{display:block;color:var(--tx3);font-size:.8rem;margin-bottom:.15rem}
.df{display:flex;justify-content:flex-end;gap:.6rem;padding:.9rem 1.25rem calc(.9rem + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}

@media (max-width:860px){
 .menu-btn{display:grid}
 .nav{position:absolute;left:0;right:0;top:100%;flex-direction:column;margin:0;padding:.5rem 1.25rem 1rem;background:var(--bg);border-bottom:1px solid var(--bd);visibility:hidden;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s var(--ease),visibility .25s}
 .nav.open{visibility:visible;opacity:1;transform:none}
 .nav a{padding:.7rem .5rem;font-size:1rem}
 .ctl{margin-left:auto}
 .ins{grid-template-columns:1fr;gap:2rem}.cmd{position:static;order:-1}
}
@media (max-width:640px){
 section{padding-top:4rem}
 .pr{grid-template-columns:1fr;gap:2rem}
 .row{grid-template-columns:40px 1fr 20px;gap:.8rem}.row kbd{display:none}
 .ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .bar{gap:.75rem}.brand span{display:none}
 .btn{flex:1;justify-content:center}
 .au{padding:1.25rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const R=document.documentElement,sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const mq=matchMedia('(prefers-color-scheme:dark)');
let theme=ld('xp-theme')||'system',lang=ld('xp-lang')||((navigator.language||'').toLowerCase().startsWith('vi')?'vi':'en'),cat='all',query='',cur=null;
const ic=()=>window.lucide&&lucide.createIcons();

function setTheme(t,anim){
 theme=t;sv('xp-theme',t);
 if(anim){R.classList.add('theming');setTimeout(()=>R.classList.remove('theming'),350)}
 const d=t==='dark'||(t==='system'&&mq.matches);R.dataset.theme=d?'dark':'light';
 $('#tc').content=d?'#0d0d0e':'#fafaf9';
 $$('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
}
mq.addEventListener('change',()=>theme==='system'&&setTheme('system'));

function setLang(l){
 lang=l;sv('xp-lang',l);R.lang=l;const t=T[l];
 $$('[data-i]').forEach(e=>e.innerHTML=t[e.dataset.i]);
 $$('[data-ph]').forEach(e=>e.placeholder=t[e.dataset.ph]);
 $$('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 document.title=l==='vi'?'My Extension Pack — Tiện ích Chromium của minhtrong67':'My Extension Pack — Chromium extensions by minhtrong67';
 render();if(cur)fill(cur);ic();
}

const L=(x,k)=>x[lang][k],sc=x=>Array.isArray(x.sc)?x.sc[lang==='vi'?0:1]:x.sc;
const icon=x=>`${x.id}/icons/${x.id==='multi-downloader'?'icon128.png':'icon.svg'}`;
const fb=x=>`this.onerror=null;this.src='${x.id}/icons/icon128.png'`;

function render(){
 const q=query.toLowerCase().trim();
 const f=X.filter(x=>(cat==='all'||x.c===cat)&&(!q||[x.n,x.id,L(x,'t'),L(x,'d'),...x[lang].f].join(' ').toLowerCase().includes(q)));
 $('#list').innerHTML=f.map((x,i)=>`<button class="row" style="--i:${i}" data-id="${x.id}"><span class="ico"><img src="${icon(x)}" alt="" loading="lazy" onerror="${fb(x)}"></span><span><span class="nm">${x.n}<small>v${x.v}</small></span><span class="ds" style="display:block">${L(x,'d')}</span></span><kbd>${sc(x)}</kbd><i class="go" data-lucide="chevron-right"></i></button>`).join('');
 $('#empty').classList.toggle('on',!f.length);ic();
}

function fill(x){
 $('#dI').src=icon(x);$('#dI').onerror=function(){this.onerror=null;this.src=`${x.id}/icons/icon128.png`};
 $('#dT').textContent=x.n+' ';$('#dTag').textContent=L(x,'t');$('#dD').textContent=L(x,'d');
 $('#dF').innerHTML=x[lang].f.map(s=>`<li><i data-lucide="check"></i><span>${s}</span></li>`).join('');
 $('#dSc').textContent=sc(x);$('#dPm').textContent=x.p;$('#dFo').textContent='/'+x.id;$('#dG').href=`https://github.com/minhtrong67/my-extension-pack/tree/main/${x.id}`;
 const e=x.id==='case-converter'?'svg':'png';
 $('#dS').innerHTML=Array.from({length:x.sh},(_,i)=>`<img src="${x.id}/screenshots/image0${i+1}.${e}" alt="${x.n} ${i+1}" loading="lazy" onerror="this.remove()">`).join('');
 $('#dS').style.display=x.sh?'flex':'none';ic();
}
const dlg=$('#dlg');
function open(id){cur=X.find(x=>x.id===id);fill(cur);dlg.showModal();R.style.overflow='hidden'}
function close(){if(!dlg.open)return;dlg.classList.add('closing');setTimeout(()=>{dlg.close();dlg.classList.remove('closing');R.style.overflow='';cur=null},180)}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.row');b&&open(b.dataset.id)});
$('#dX').onclick=$('#dC').onclick=close;
dlg.addEventListener('click',e=>{if(e.target===dlg)close()});
dlg.addEventListener('cancel',e=>{e.preventDefault();close()});

$('#themeSeg').addEventListener('click',e=>{const b=e.target.closest('button');b&&setTheme(b.dataset.t,true)});
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('button');b&&b.dataset.l!==lang&&setLang(b.dataset.l)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;$$('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#q').addEventListener('input',e=>{query=e.target.value;render()});

const nav=$('#nav'),mb=$('#menuBtn');
mb.onclick=()=>{const o=nav.classList.toggle('open');mb.setAttribute('aria-expanded',o)};
nav.addEventListener('click',e=>{if(e.target.closest('a')){nav.classList.remove('open');mb.setAttribute('aria-expanded',false)}});

$('#faqList').addEventListener('click',e=>{const b=e.target.closest('.q');if(!b)return;const f=b.parentElement,o=f.classList.toggle('open');b.setAttribute('aria-expanded',o)});

$('#cp').onclick=function(){
 const b=this,done=()=>{const s=b.querySelector('span');s.textContent=T[lang].copied;b.classList.add('ok');setTimeout(()=>{s.textContent=T[lang].copy;b.classList.remove('ok')},2000)};
 const txt=$('#cmdTxt').textContent;
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done).catch(()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove()});
};

setTheme(theme);setLang(lang);
