<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite Shield</title>
  <link rel="stylesheet" href="../shared/m3.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="shell">
    <nav class="rail" data-i18n-attr="aria-label:nav.aria">
      <div class="brand" aria-hidden="true" data-icon="shield-check"></div>
      <a class="nav" href="#protection" data-panel="protection"><span class="pill" data-icon="shield"></span><span class="label-m" data-i18n="nav.protection"></span></a>
      <a class="nav" href="#filters" data-panel="filters"><span class="pill" data-icon="list"></span><span class="label-m" data-i18n="nav.filters"></span></a>
      <a class="nav" href="#sites" data-panel="sites"><span class="pill" data-icon="globe"></span><span class="label-m" data-i18n="nav.sites"></span></a>
      <a class="nav" href="#appearance" data-panel="appearance"><span class="pill" data-icon="palette"></span><span class="label-m" data-i18n="nav.appearance"></span></a>
      <a class="nav" href="#backup" data-panel="backup"><span class="pill" data-icon="download"></span><span class="label-m" data-i18n="nav.backup"></span></a>
      <a class="nav" href="#about" data-panel="about"><span class="pill" data-icon="info"></span><span class="label-m" data-i18n="nav.about"></span></a>
    </nav>

    <main class="content">
      <!-- ===== Bảo vệ ===== -->
      <section class="panel" id="p-protection">
        <header class="ph">
          <h1 class="display-s" data-i18n="prot.title"></h1>
          <p class="body-l muted" data-i18n="prot.desc"></p>
        </header>

        <div class="stats-row">
          <div class="stat-card a"><div class="display-s num" id="stat-today">0</div><div class="label-m" data-i18n="prot.today"></div></div>
          <div class="stat-card b"><div class="display-s num" id="stat-total">0</div><div class="label-m" data-i18n="prot.total"></div></div>
        </div>

        <div class="list" id="rulesets"></div>

        <div class="list" style="margin-top: 24px">
          <div class="list-item">
            <div class="lead" data-icon="layout"></div>
            <div class="grow"><div class="title-m" data-i18n="prot.generic.title"></div><div class="body-m muted" data-i18n="prot.generic.desc"></div></div>
            <label class="switch"><input type="checkbox" id="generic-cosmetic" data-i18n-attr="aria-label:prot.generic.title" /></label>
          </div>
          <div class="list-item">
            <div class="lead" data-icon="play"></div>
            <div class="grow"><div class="title-m"><span data-i18n="prot.yt.title"></span> <span class="chip tertiary beta" data-i18n="prot.yt.beta"></span></div><div class="body-m muted" data-i18n="prot.yt.desc"></div></div>
            <label class="switch"><input type="checkbox" id="yt-scriptlet" data-i18n-attr="aria-label:prot.yt.title" /></label>
          </div>
        </div>

        <h2 class="title-l section-h" data-i18n="prot.upd.h"></h2>
        <div class="list">
          <div class="list-item">
            <div class="lead" data-icon="refresh"></div>
            <div class="grow"><div class="title-m" id="upd-title"></div><div class="body-m muted" id="upd-sub"></div></div>
            <button class="btn tonal" id="upd-now"><span data-i18n="upd.now"></span></button>
          </div>
          <div class="list-item">
            <div class="lead" data-icon="clock"></div>
            <div class="grow"><div class="title-m" data-i18n="prot.auto.title"></div><div class="body-m muted" data-i18n="prot.auto.desc"></div></div>
            <label class="switch"><input type="checkbox" id="auto-update" data-i18n-attr="aria-label:prot.auto.title" /></label>
          </div>
        </div>

        <h2 class="title-l section-h" data-i18n="prot.pick.h"></h2>
        <div class="list">
          <div class="list-item">
            <div class="lead" data-icon="target"></div>
            <div class="grow"><div class="title-m"><span data-i18n="prot.pick.shortcut"></span> <kbd id="kbd">Alt + Shift + X</kbd></div><div class="body-m muted" data-i18n="prot.pick.desc"></div></div>
            <button class="btn tonal" id="shortcuts"><span data-i18n="prot.pick.change"></span></button>
          </div>
        </div>
      </section>

      <!-- ===== Bộ lọc của tôi ===== -->
      <section class="panel" id="p-filters">
        <header class="ph">
          <h1 class="display-s" data-i18n="flt.title"></h1>
          <p class="body-l muted" data-i18n="flt.desc"></p>
        </header>
        <div class="editor card hi">
          <textarea id="filters" class="field mono" spellcheck="false" rows="14" data-i18n-attr="placeholder:flt.placeholder"></textarea>
          <div class="editor-bar">
            <div class="chips" id="stats"></div>
            <span class="grow"></span>
            <button class="btn filled lg" id="save-filters" data-icon="save"><span data-i18n="flt.save"></span></button>
          </div>
        </div>
        <div class="card errors" id="errors" hidden></div>
        <details class="card help">
          <summary class="title-m" data-i18n="flt.help"></summary>
          <ul class="body-m">
            <li data-i18n-html="flt.help1"></li>
            <li data-i18n-html="flt.help2"></li>
            <li data-i18n-html="flt.help3"></li>
            <li data-i18n-html="flt.help4"></li>
            <li data-i18n-html="flt.help5"></li>
            <li data-i18n-html="flt.help6"></li>
            <li class="muted" data-i18n="flt.help7"></li>
          </ul>
        </details>
      </section>

      <!-- ===== Trang web ===== -->
      <section class="panel" id="p-sites">
        <header class="ph">
          <h1 class="display-s" data-i18n="sites.title"></h1>
          <p class="body-l muted" data-i18n="sites.desc"></p>
        </header>
        <form class="add-site" id="add-site">
          <input class="field" id="site-input" placeholder="example.com" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:sites.inputAria" />
          <button class="btn tonal lg" type="submit" data-icon="plus"><span data-i18n="sites.add"></span></button>
        </form>
        <div class="list" id="sites-list"></div>
        <div class="empty" id="sites-empty">
          <svg viewBox="-100 -100 200 200" aria-hidden="true"><path id="empty-cookie" /></svg>
          <div class="title-m" data-i18n="sites.emptyTitle"></div>
          <div class="body-m muted" data-i18n="sites.emptyDesc"></div>
        </div>

        <h2 class="title-l section-h" data-i18n="dom.h"></h2>
        <p class="body-m muted" style="margin: 0 0 16px" data-i18n="dom.desc"></p>
        <form class="add-site" id="add-domain">
          <input class="field" id="domain-input" placeholder="cdn.example.com" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:dom.inputAria" />
          <button class="btn tonal lg" type="submit" data-icon="plus"><span data-i18n="sites.add"></span></button>
        </form>
        <div class="list" id="domains-list"></div>
        <div class="body-m muted" id="domains-empty" style="padding: 8px 4px" data-i18n="dom.empty"></div>
      </section>

      <!-- ===== Giao diện ===== -->
      <section class="panel" id="p-appearance">
        <header class="ph">
          <h1 class="display-s" data-i18n="app.title"></h1>
          <p class="body-l muted" data-i18n="app.desc"></p>
        </header>

        <div class="card hi group">
          <div><div class="title-m" data-i18n="app.mode"></div><div class="body-m muted" data-i18n="app.modeDesc"></div></div>
          <div class="segmented icons" id="mode" role="radiogroup" data-i18n-attr="aria-label:app.mode">
            <label><input type="radio" name="mode" value="light" /><span><i data-icon="sun"></i><b data-i18n="mode.light"></b></span></label>
            <label><input type="radio" name="mode" value="dark" /><span><i data-icon="moon"></i><b data-i18n="mode.dark"></b></span></label>
            <label><input type="radio" name="mode" value="auto" /><span><i data-icon="monitor"></i><b data-i18n="mode.auto"></b></span></label>
          </div>
        </div>

        <section class="acc" id="acc-color">
          <button type="button" class="acc-head" aria-expanded="false" aria-controls="acc-color-body">
            <span class="acc-title"><span class="title-m" data-i18n="app.color"></span><span class="body-m muted" style="display:block" data-i18n="app.colorDesc"></span></span>
            <span class="acc-value"><span class="acc-dot" id="color-dot"></span><span id="color-name"></span></span>
            <span class="acc-chevron" data-icon="chevron"></span>
          </button>
          <div class="acc-body" id="acc-color-body" role="region"><div class="acc-inner"><div class="swatches" id="swatches" role="radiogroup" data-i18n-attr="aria-label:app.color"></div></div></div>
        </section>

        <div class="card hi group">
          <div><div class="title-m" data-i18n="app.size"></div><div class="body-m muted" data-i18n="app.sizeDesc"></div></div>
          <div class="segmented" id="fsize" role="radiogroup" data-i18n-attr="aria-label:app.size">
            <label><input type="radio" name="fsize" value="small" /><span data-i18n="size.small"></span></label>
            <label><input type="radio" name="fsize" value="medium" /><span data-i18n="size.medium"></span></label>
            <label><input type="radio" name="fsize" value="large" /><span data-i18n="size.large"></span></label>
          </div>
        </div>

        <div class="card hi group">
          <div><div class="title-m" data-i18n="app.lang"></div><div class="body-m muted" data-i18n="app.langDesc"></div></div>
          <div class="segmented" id="lang" role="radiogroup" data-i18n-attr="aria-label:app.lang">
            <label><input type="radio" name="lang" value="vi" /><span>Tiếng Việt</span></label>
            <label><input type="radio" name="lang" value="en" /><span>English</span></label>
          </div>
        </div>

        <div class="card hi group">
          <div><div class="title-m" data-i18n="app.font"></div><div class="body-m muted" data-i18n="app.fontDesc"></div></div>
          <div id="font-select"></div>
          <div class="font-sample" id="font-sample"></div>
        </div>

        <section class="acc" id="acc-preview">
          <button type="button" class="acc-head" aria-expanded="false" aria-controls="acc-preview-body">
            <span class="acc-title"><span class="title-m" data-i18n="app.preview"></span></span>
            <span class="acc-chevron" data-icon="chevron"></span>
          </button>
          <div class="acc-body" id="acc-preview-body" role="region"><div class="acc-inner">
            <div class="preview-row">
              <button class="btn filled" tabindex="-1" data-i18n="preview.primary"></button>
              <button class="btn tonal" tabindex="-1" data-i18n="preview.tonal"></button>
              <button class="btn outlined" tabindex="-1" data-i18n="preview.outlined"></button>
              <label class="switch"><input type="checkbox" checked tabindex="-1" data-i18n-attr="aria-label:preview.switch" /></label>
              <span class="chip primary" data-i18n="preview.chip"></span>
              <span class="chip tertiary" data-i18n="preview.tertiary"></span>
            </div>
          </div></div>
        </section>
      </section>

      <!-- ===== Sao lưu ===== -->
      <section class="panel" id="p-backup">
        <header class="ph">
          <h1 class="display-s" data-i18n="bk.title"></h1>
          <p class="body-l muted" data-i18n="bk.desc"></p>
        </header>
        <div class="list">
          <div class="list-item">
            <div class="lead" data-icon="download"></div>
            <div class="grow"><div class="title-m" data-i18n="bk.exportTitle"></div><div class="body-m muted" data-i18n="bk.exportDesc"></div></div>
            <button class="btn filled" id="export" data-i18n="bk.exportBtn"></button>
          </div>
          <div class="list-item">
            <div class="lead" data-icon="upload"></div>
            <div class="grow"><div class="title-m" data-i18n="bk.importTitle"></div><div class="body-m muted" data-i18n="bk.importDesc"></div></div>
            <button class="btn tonal" id="import" data-i18n="bk.importBtn"></button>
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </div>
        </div>
      </section>

      <!-- ===== Giới thiệu ===== -->
      <section class="panel" id="p-about">
        <header class="ph">
          <h1 class="display-s" data-i18n="ab.title"></h1>
          <p class="body-l muted" data-i18n="ab.desc"></p>
        </header>

        <div class="about-app card hi">
          <div class="about-logo" aria-hidden="true" data-icon="shield-check"></div>
          <div class="grow">
            <div class="headline-m">Lite Shield</div>
            <div class="body-m muted" id="ab-version"></div>
            <div class="body-m" style="margin-top: 6px" data-i18n="ab.tagline"></div>
          </div>
        </div>

        <div class="author-card" id="author-card">
          <div class="author-glow" aria-hidden="true"></div>
          <div class="author-row">
            <div class="author-avatar" aria-hidden="true" data-icon="user"></div>
            <div class="grow">
              <div class="label-m author-label" data-i18n="ab.authorLabel"></div>
              <div class="headline-m author-name">minhtrong67</div>
            </div>
          </div>
          <div class="author-ai">
            <div class="ai-chip"><span data-icon="sparkles"></span><span data-i18n="ab.aiLabel"></span> · <strong>Claude</strong></div>
          </div>
          <p class="body-l author-note" data-i18n-html="ab.authorNote"></p>
        </div>

        <div class="about-actions">
          <a class="btn filled lg" id="landing-link" href="../landing/index.html" target="_blank" rel="noopener" data-icon="rocket"><span data-i18n="ab.landing"></span></a>
          <a class="btn tonal lg" id="source-link" href="https://github.com/minhtrong67/my-chrome-extensions" target="_blank" rel="noopener noreferrer" data-icon="code"><span data-i18n="ab.source"></span></a>
        </div>

        <section class="acc" id="acc-credits">
          <button type="button" class="acc-head" aria-expanded="false" aria-controls="acc-credits-body">
            <span class="acc-title"><span class="title-m" data-i18n="ab.credits"></span></span>
            <span class="acc-chevron" data-icon="chevron"></span>
          </button>
          <div class="acc-body" id="acc-credits-body" role="region"><div class="acc-inner">
            <ul class="credits body-m muted">
              <li data-i18n="ab.credit1"></li>
              <li data-i18n="ab.credit2"></li>
              <li data-i18n="ab.credit3"></li>
              <li data-i18n="ab.credit4"></li>
            </ul>
          </div></div>
        </section>
      </section>
    </main>
  </div>

  <button class="fab" id="to-top" type="button" data-icon="up" data-i18n-attr="aria-label:scroll.top"></button>
  <script type="module" src="options.js"></script>
</body>
</html>
