<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite Shield</title>
  <link rel="stylesheet" href="../shared/m3.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="pop">
    <header>
      <div class="avatar" id="avatar">L</div>
      <div class="grow">
        <div class="title-m ellipsis" id="host" data-i18n="popup.loading"></div>
        <div class="label-m muted" id="sub">Lite Shield</div>
      </div>
      <button class="icon-btn tonal" id="open-options" data-i18n-attr="title:popup.settings;aria-label:popup.settings" data-icon="settings"></button>
    </header>

    <section class="hero" id="hero">
      <svg class="cookie" viewBox="-100 -100 200 200" aria-hidden="true"><path id="cookie-path" /></svg>
      <button class="power" id="power" aria-pressed="true" data-i18n-attr="aria-label:popup.powerAria;title:popup.powerAria" data-icon="power"></button>
    </section>

    <div class="status">
      <div class="headline-s" id="status">&nbsp;</div>
      <div class="body-m muted" id="hint">&nbsp;</div>
    </div>

    <section class="stats">
      <div class="stat primary">
        <div class="display-s num" id="blocked">0</div>
        <div class="label-m" data-i18n="popup.blocked"></div>
      </div>
      <div class="stat tertiary">
        <div class="display-s num" id="hidden">0</div>
        <div class="label-m" data-i18n="popup.hidden"></div>
      </div>
    </section>

    <nav class="btn-group" data-i18n-attr="aria-label:popup.quick">
      <button class="btn" id="pick" data-icon="target"><span data-i18n="popup.pick"></span></button>
      <button class="btn" id="restore" data-icon="undo"><span id="restore-label" data-i18n="popup.restore"></span></button>
      <button class="btn" id="log-open" data-icon="list"><span data-i18n="popup.log"></span></button>
      <button class="btn" id="reload" data-icon="refresh"><span data-i18n="popup.reload"></span></button>
    </nav>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" data-i18n-attr="aria-label:log.title" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <div class="grow">
        <div class="title-l" data-i18n="log.title"></div>
        <div class="body-m muted" id="log-sub" data-i18n="log.subDefault"></div>
      </div>
      <button class="icon-btn tonal" id="log-close" data-i18n-attr="aria-label:log.close" data-icon="close"></button>
    </header>
    <div class="sheet-body" id="log-list"></div>
  </aside>

  <script type="module" src="popup.js"></script>
</body>
</html>
