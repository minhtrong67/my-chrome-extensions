<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNote</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/settings.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand"><img src="icons/icon48.png" width="28" height="28" alt="" /><span>QuickNote</span></div>
        <button class="icon-btn md-ripple-host" id="sidebarClose" data-i18n-title="hideSidebar"><i data-icon="panel-left-close"></i></button>
      </div>

      <label class="search-field">
        <i data-icon="search" data-size="18"></i>
        <input type="search" id="searchInput" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
      </label>

      <div class="chip-row" id="viewChips" role="tablist">
        <button class="chip active md-ripple-host" data-view="active" role="tab"><i data-icon="file-text" data-size="16"></i><span data-i18n="allNotes"></span></button>
        <button class="chip md-ripple-host" data-view="pinned" role="tab"><i data-icon="pin" data-size="16"></i><span data-i18n="pinnedNotes"></span></button>
        <button class="chip md-ripple-host" data-view="trash" role="tab"><i data-icon="trash-2" data-size="16"></i><span data-i18n="viewTrash"></span></button>
      </div>

      <label class="sort-row">
        <i data-icon="arrow-up-down" data-size="16"></i>
        <span data-i18n="sortLabel"></span>
        <select id="sortSelect">
          <option value="updated" data-i18n="sortUpdated"></option>
          <option value="created" data-i18n="sortCreated"></option>
          <option value="title" data-i18n="sortTitle"></option>
        </select>
      </label>

      <div class="notes-list" id="notesList" role="list"></div>

      <button class="text-btn danger has-icon md-ripple-host" id="btnEmptyTrash" hidden><i data-icon="trash-2" data-size="18"></i><span data-i18n="emptyTrash"></span></button>
      <button class="fab md-ripple-host" id="btnNewNote"><i data-icon="plus" data-size="22"></i><span data-i18n="newNote"></span></button>
    </aside>

    <!-- ============ EDITOR ============ -->
    <main class="editor-area">
      <header class="topbar">
        <button class="icon-btn md-ripple-host" id="sidebarOpen" data-i18n-title="showSidebar" hidden><i data-icon="panel-left"></i></button>
        <span class="save-indicator" id="saveIndicator"><i data-icon="check" data-size="16"></i><span data-i18n="saved"></span></span>
        <span class="spacer"></span>

        <div class="note-actions" id="noteActions">
          <button class="icon-btn md-ripple-host" id="btnPin"><i data-icon="pin"></i></button>
          <button class="icon-btn md-ripple-host" id="btnColor" data-i18n-title="labelColor"><i data-icon="tag"></i></button>
          <button class="icon-btn md-ripple-host" id="btnDuplicate" data-i18n-title="duplicate"><i data-icon="copy"></i></button>
          <button class="icon-btn md-ripple-host" id="btnCopy" data-i18n-title="copyContent"><i data-icon="clipboard-copy"></i></button>
          <button class="icon-btn danger md-ripple-host" id="btnDelete" data-i18n-title="moveToTrash"><i data-icon="trash-2"></i></button>
          <span class="divider-v"></span>
        </div>
        <button class="icon-btn md-ripple-host" id="btnImportExport" data-i18n-title="importExport"><i data-icon="arrow-up-down"></i></button>
        <button class="icon-btn md-ripple-host" id="btnSettings" data-i18n-title="settings"><i data-icon="settings"></i></button>
      </header>

      <div class="menu" id="colorMenu" role="menu">
        <button class="menu-item md-ripple-host" data-color=""><span class="dot none"></span><span data-i18n="colorNone"></span></button>
        <button class="menu-item md-ripple-host" data-color="red"><span class="dot" style="background:var(--md-tag-red)"></span><span data-i18n="colorRed"></span></button>
        <button class="menu-item md-ripple-host" data-color="orange"><span class="dot" style="background:var(--md-tag-orange)"></span><span data-i18n="colorOrange"></span></button>
        <button class="menu-item md-ripple-host" data-color="yellow"><span class="dot" style="background:var(--md-tag-yellow)"></span><span data-i18n="colorYellow"></span></button>
        <button class="menu-item md-ripple-host" data-color="green"><span class="dot" style="background:var(--md-tag-green)"></span><span data-i18n="colorGreen"></span></button>
        <button class="menu-item md-ripple-host" data-color="blue"><span class="dot" style="background:var(--md-tag-blue)"></span><span data-i18n="colorBlue"></span></button>
        <button class="menu-item md-ripple-host" data-color="purple"><span class="dot" style="background:var(--md-tag-purple)"></span><span data-i18n="colorPurple"></span></button>
      </div>

      <div class="menu wide" id="ieMenu" role="menu">
        <div class="menu-label" data-i18n="exportLabel"></div>
        <button class="menu-item two-line md-ripple-host" id="ieExportJson"><i data-icon="file-json" data-size="20"></i><div><span data-i18n="exportJson"></span><small data-i18n="exportJsonDesc"></small></div></button>
        <button class="menu-item two-line md-ripple-host" id="ieExportCsv"><i data-icon="file-spreadsheet" data-size="20"></i><div><span data-i18n="exportCsv"></span><small data-i18n="exportCsvDesc"></small></div></button>
        <button class="menu-item two-line md-ripple-host" id="ieExportMd"><i data-icon="file-code" data-size="20"></i><div><span data-i18n="exportMd"></span><small data-i18n="exportMdDesc"></small></div></button>
        <button class="menu-item two-line md-ripple-host" id="ieExportTxt"><i data-icon="file-type" data-size="20"></i><div><span data-i18n="exportTxt"></span><small data-i18n="exportTxtDesc"></small></div></button>
        <div class="menu-sep"></div>
        <div class="menu-label" data-i18n="importLabel"></div>
        <button class="menu-item two-line md-ripple-host" id="ieImportJson"><i data-icon="arrow-up-from-line" data-size="20"></i><div><span data-i18n="importJson"></span><small data-i18n="importJsonDesc"></small></div></button>
        <button class="menu-item two-line md-ripple-host" id="ieImportCsv"><i data-icon="arrow-up-from-line" data-size="20"></i><div><span data-i18n="importCsv"></span><small data-i18n="importCsvDesc"></small></div></button>
        <button class="menu-item two-line md-ripple-host" id="ieImportTxt"><i data-icon="arrow-up-from-line" data-size="20"></i><div><span data-i18n="importTxt"></span><small data-i18n="importTxtDesc"></small></div></button>
        <input type="file" id="fileJson" accept=".json,application/json" hidden />
        <input type="file" id="fileCsv" accept=".csv,text/csv" hidden />
        <input type="file" id="fileTxt" accept=".txt,.md,text/plain,text/markdown" multiple hidden />
      </div>

      <section class="editor-body" id="editorBody">
        <input type="text" class="title-input" id="titleInput" data-i18n-placeholder="titlePlaceholder" maxlength="120" autocomplete="off" />
        <textarea class="content-input" id="contentInput" spellcheck="false" data-i18n-placeholder="contentPlaceholder"></textarea>
        <div class="word-count" id="wordCount"></div>
      </section>

      <section class="empty-state" id="emptyState" hidden>
        <i data-icon="notebook-pen" data-size="56" data-stroke="1.25"></i>
        <h2 id="emptyTitle"></h2><p id="emptyDesc"></p>
      </section>

      <section class="trash-preview" id="trashPreview" hidden>
        <div class="trash-head"><h2 id="trashTitle"></h2><span class="badge" id="trashDays"></span></div>
        <p class="trash-body" id="trashBody"></p>
        <div class="trash-actions">
          <button class="tonal-btn has-icon md-ripple-host" id="btnRestore"><i data-icon="archive-restore" data-size="18"></i><span data-i18n="restore"></span></button>
          <button class="text-btn danger has-icon md-ripple-host" id="btnForever"><i data-icon="trash-2" data-size="18"></i><span data-i18n="deleteForever"></span></button>
        </div>
      </section>
    </main>

    <!-- ============ SETTINGS (slide-over, stays inside the popup) ============ -->
    <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
      <header class="panel-bar">
        <button class="icon-btn md-ripple-host" id="settingsBack" data-i18n-title="back"><i data-icon="arrow-left"></i></button>
        <h1 data-i18n="settingsTitle"></h1>
      </header>
      <div class="panel-body" id="settingsRoot"></div>
    </aside>

    <!-- ============ DIALOGS ============ -->
    <div class="scrim" id="dialogScrim" hidden>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="dialog-icon" id="dlgIcon"></div>
        <h3 id="dlgTitle"></h3>
        <p id="dlgDesc"></p>
        <div class="dialog-extra" id="dlgExtra" hidden>
          <label class="radio"><input type="radio" name="importMode" value="merge" checked /><span data-i18n="importMerge"></span></label>
          <label class="radio"><input type="radio" name="importMode" value="replace" /><span data-i18n="importReplace"></span></label>
        </div>
        <div class="dialog-actions">
          <button class="text-btn md-ripple-host" id="dlgCancel" data-i18n="cancel"></button>
          <button class="filled-btn md-ripple-host" id="dlgOk"></button>
        </div>
      </div>
    </div>

    <div class="snackbar" id="snackbar" role="status" aria-live="polite">
      <span id="snackbarText"></span>
      <button class="snackbar-action md-ripple-host" id="snackbarAction" hidden></button>
    </div>
  </div>

  <script src="shared/palettes.js"></script>
  <script src="shared/icons.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/settings.js"></script>
  <script src="shared/ripple.js"></script>
  <script src="shared/settings-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
