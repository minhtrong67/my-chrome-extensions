<!DOCTYPE html>
<html lang="en" data-theme="light" data-color="teal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Password Generator</title>
<script src="js/boot.js"></script>
<link rel="stylesheet" href="css/colors.css" />
<link rel="stylesheet" href="css/popup.css" />
</head>
<body>
<div class="app">

  <!-- ============ Main view ============ -->
  <section class="view" id="viewMain">
    <header class="appbar">
      <img class="appbar-logo" src="icons/icon48.png" alt="" width="32" height="32" />
      <h1 class="appbar-title" data-i18n="appName">Password Generator</h1>
      <button class="icon-btn" id="settingsBtn" type="button" data-i18n-label="settings"><i data-icon="settings"></i></button>
    </header>

    <div class="scroll" id="mainScroll">
      <div class="segmented" id="modeTabs" role="tablist">
        <button class="seg is-selected" role="tab" aria-selected="true" data-mode="password" type="button"><i data-icon="key-round"></i><span data-i18n="modePassword">Password</span></button>
        <button class="seg" role="tab" aria-selected="false" data-mode="passphrase" type="button"><i data-icon="type"></i><span data-i18n="modePassphrase">Passphrase</span></button>
        <button class="seg" role="tab" aria-selected="false" data-mode="pin" type="button"><i data-icon="hash"></i><span data-i18n="modePin">PIN</span></button>
      </div>

      <section class="card result-card">
        <div class="result-row">
          <output class="result" id="result" aria-live="polite">—</output>
          <div class="result-actions">
            <button class="icon-btn tonal" id="copyBtn" type="button" data-i18n-label="copy"><i data-icon="copy" class="ic-copy"></i><i data-icon="check" class="ic-done"></i></button>
            <button class="icon-btn tonal" id="regenBtn" type="button" data-i18n-label="regenerate"><i data-icon="refresh-cw"></i></button>
          </div>
        </div>
        <div class="strength">
          <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="4" id="meter"><div class="meter-fill" id="meterFill"></div></div>
          <div class="strength-meta">
            <span class="strength-label" id="strengthLabel">—</span>
            <span class="crack"><span data-i18n="crackLabel">Time to crack</span>: <b id="crackTime">—</b></span>
          </div>
        </div>
      </section>

      <!-- Password options -->
      <section class="card options" id="optsPassword">
        <div class="slider-row">
          <label for="length" data-i18n="length">Length</label>
          <output class="value-pill" id="lengthOut">16</output>
        </div>
        <input class="slider" type="range" id="length" min="4" max="64" step="1" />

        <div class="chips" role="group">
          <label class="chip"><input type="checkbox" id="upper" /><span><i data-icon="check"></i><span data-i18n="uppercase">A–Z</span></span></label>
          <label class="chip"><input type="checkbox" id="lower" /><span><i data-icon="check"></i><span data-i18n="lowercase">a–z</span></span></label>
          <label class="chip"><input type="checkbox" id="numbers" /><span><i data-icon="check"></i><span data-i18n="numbers">0–9</span></span></label>
          <label class="chip"><input type="checkbox" id="symbols" /><span><i data-icon="check"></i><span data-i18n="symbols">#$%</span></span></label>
        </div>

        <button class="disclosure" id="advToggle" type="button" aria-expanded="false" aria-controls="advPanel">
          <span data-i18n="advanced">Advanced options</span><i data-icon="chevron-down"></i>
        </button>
        <div class="collapse" id="advPanel"><div class="collapse-inner">
          <label class="switch-row"><span data-i18n="excludeAmbiguous">Exclude look-alike characters</span><input type="checkbox" class="switch" id="excludeAmbiguous" /></label>
          <label class="switch-row"><span data-i18n="noDuplicate">No repeated characters</span><input type="checkbox" class="switch" id="noDuplicate" /></label>
          <div class="field">
            <input type="text" id="customExclude" placeholder=" " maxlength="40" autocomplete="off" spellcheck="false" />
            <label for="customExclude" data-i18n="customExclude">Characters to exclude</label>
          </div>
        </div></div>
      </section>

      <!-- Passphrase options -->
      <section class="card options" id="optsPassphrase" hidden>
        <div class="slider-row">
          <label for="wordCount" data-i18n="wordCount">Words</label>
          <output class="value-pill" id="wordCountOut">4</output>
        </div>
        <input class="slider" type="range" id="wordCount" min="3" max="10" step="1" />
        <div class="group-label" data-i18n="separator">Separator</div>
        <div class="chips" role="radiogroup">
          <label class="chip"><input type="radio" name="sep" value="-" /><span><i data-icon="check"></i><span>-</span></span></label>
          <label class="chip"><input type="radio" name="sep" value="_" /><span><i data-icon="check"></i><span>_</span></span></label>
          <label class="chip"><input type="radio" name="sep" value="." /><span><i data-icon="check"></i><span>.</span></span></label>
          <label class="chip"><input type="radio" name="sep" value=" " /><span><i data-icon="check"></i><span data-i18n="sepSpace">Space</span></span></label>
        </div>
        <label class="switch-row"><span data-i18n="capitalize">Capitalize words</span><input type="checkbox" class="switch" id="capitalize" /></label>
        <label class="switch-row"><span data-i18n="addNumber">Add a number</span><input type="checkbox" class="switch" id="addNumber" /></label>
      </section>

      <!-- PIN options -->
      <section class="card options" id="optsPin" hidden>
        <div class="slider-row">
          <label for="pinLength" data-i18n="pinLength">Digits</label>
          <output class="value-pill" id="pinLengthOut">6</output>
        </div>
        <input class="slider" type="range" id="pinLength" min="4" max="12" step="1" />
      </section>

      <section class="history" id="historySection">
        <div class="history-head">
          <div>
            <h2 data-i18n="history">Recent</h2>
            <p data-i18n="historyHint">Cleared when you close the browser</p>
          </div>
          <button class="text-btn" id="clearHistory" type="button"><i data-icon="trash-2"></i><span data-i18n="clear">Clear</span></button>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </section>
    </div>

    <div class="bottom-bar">
      <button class="btn filled" id="generateBtn" type="button"><i data-icon="refresh-cw"></i><span id="generateLabel">Generate password</span></button>
    </div>
  </section>

  <!-- ============ Settings view ============ -->
  <section class="view is-right" id="viewSettings" inert aria-hidden="true">
    <header class="appbar">
      <button class="icon-btn" id="backBtn" type="button" data-i18n-label="back"><i data-icon="arrow-left"></i></button>
      <h1 class="appbar-title" data-i18n="settings">Settings</h1>
    </header>

    <div class="scroll">
      <section class="s-section">
        <h2 class="s-title"><i data-icon="palette"></i><span data-i18n="appearance">Color</span><em id="colorName"></em></h2>
        <div class="swatches" id="swatches" role="radiogroup"></div>
      </section>

      <section class="s-section">
        <h2 class="s-title"><i data-icon="sun"></i><span data-i18n="themeTitle">Theme</span></h2>
        <div class="segmented" id="themeSeg" role="radiogroup">
          <button class="seg" role="radio" data-value="system" type="button"><i data-icon="monitor"></i><span data-i18n="themeSystem">System</span></button>
          <button class="seg" role="radio" data-value="light" type="button"><i data-icon="sun"></i><span data-i18n="themeLight">Light</span></button>
          <button class="seg" role="radio" data-value="dark" type="button"><i data-icon="moon"></i><span data-i18n="themeDark">Dark</span></button>
        </div>
      </section>

      <section class="s-section">
        <h2 class="s-title"><i data-icon="languages"></i><span data-i18n="languageTitle">Language</span></h2>
        <div class="segmented" id="langSeg" role="radiogroup">
          <button class="seg" role="radio" data-value="auto" type="button"><span data-i18n="langAuto">Auto</span></button>
          <button class="seg" role="radio" data-value="en" type="button"><span>English</span></button>
          <button class="seg" role="radio" data-value="vi" type="button"><span>Tiếng Việt</span></button>
        </div>
      </section>

      <section class="card about">
        <img src="icons/icon128.png" alt="" width="48" height="48" />
        <div class="about-text">
          <strong>Password Generator</strong>
          <span><span data-i18n="version">Version</span> <span id="version"></span></span>
        </div>
        <dl>
          <div><dt><i data-icon="user"></i><span data-i18n="author">Author</span></dt><dd>minhtrong67</dd></div>
          <div><dt><i data-icon="bot"></i><span>AI</span></dt><dd data-i18n="madeWith">Supported by Claude (Anthropic)</dd></div>
        </dl>
        <button class="btn tonal" id="landingBtn" type="button"><i data-icon="external-link"></i><span data-i18n="openLanding">Open landing page</span></button>
      </section>
    </div>
  </section>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
</div>

<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/wordlist.js"></script>
<script src="js/generator.js"></script>
<script src="js/main.js"></script>
</body>
</html>
