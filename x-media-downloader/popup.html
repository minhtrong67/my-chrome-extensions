<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Media Downloader</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="src/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="popup">
  <header class="pop-head">
    <img src="icons/icon48.png" alt="" width="40" height="40">
    <div class="grow"><strong>X Media Downloader</strong><p class="muted" id="ver"></p></div>
    <button class="icon-btn" id="openSettings" type="button">
      <svg viewBox="0 0 24 24"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7V20a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>
  <div class="tiles" id="errTiles" hidden>
    <div class="tile alert"><span class="tile-text"><span class="tile-title" id="errText"></span></span><button type="button" class="btn tonal" id="errView" data-i18n="popup.view"></button></div>
  </div>
  <div class="tiles">
    <label class="tile"><span class="tile-text"><span class="tile-title" data-i18n="popup.enable"></span></span>
      <span class="switch"><input type="checkbox" id="enabled"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span></label>
    <label class="tile"><span class="tile-text"><span class="tile-title" data-i18n="reveal.title"></span></span>
      <span class="switch"><input type="checkbox" id="autoReveal"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span></label>
    <label class="tile"><span class="tile-text"><span class="tile-title" data-i18n="thumb.title"></span></span>
      <span class="switch"><input type="checkbox" id="downloadThumbnail"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span></label>
    <label class="tile"><span class="tile-text"><span class="tile-title" data-i18n="sc.title"></span></span>
      <span class="switch"><input type="checkbox" id="shortcutEnabled"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span></label>
  </div>
  <script src="src/mcu.js"></script>
  <script src="src/shared.js"></script>
  <script src="src/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
