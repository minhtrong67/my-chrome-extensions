<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Media Downloader</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="src/ui.css">
  <link rel="stylesheet" href="src/content.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
<div class="app">
  <nav class="rail" role="tablist" aria-orientation="vertical">
    <img class="rail-logo" src="icons/icon48.png" alt="" width="44" height="44">
    <button class="rail-item" role="tab" id="tab-download" aria-controls="pane-download" data-pane="download">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span>
      <span class="lbl" data-i18n="nav.download"></span>
    </button>
    <button class="rail-item" role="tab" id="tab-appearance" aria-controls="pane-appearance" data-pane="appearance">
      <span class="pill"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.5 1.5-1.5H16c3 0 5.5-2.5 5.5-5.5C21.5 6 17.5 2 12 2Z"/></svg></span>
      <span class="lbl" data-i18n="nav.appearance"></span>
    </button>
    <button class="rail-item" role="tab" id="tab-activity" aria-controls="pane-activity" data-pane="activity">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>
      <span class="lbl" data-i18n="nav.activity"></span>
    </button>
    <button class="rail-item" role="tab" id="tab-about" aria-controls="pane-about" data-pane="about">
      <span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
      <span class="lbl" data-i18n="nav.about"></span>
    </button>
  </nav>

  <main>
    <div class="autosave" id="autosave" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span data-i18n="autosave"></span></div>
    <!-- DOWNLOAD -->
    <section class="pane" id="pane-download" role="tabpanel" aria-labelledby="tab-download">
      <header class="page-head"><h1 data-i18n="dl.title"></h1><p data-i18n="dl.subtitle"></p></header>
      <div class="card onboard" id="onboard" hidden>
        <h2 data-i18n="ob.title"></h2>
        <ol class="ob-steps">
          <li><span class="ob-n">1</span><span data-i18n="ob.s1"></span></li>
          <li><span class="ob-n">2</span><span data-i18n="ob.s2"></span></li>
          <li><span class="ob-n">3</span><span id="ob3"></span></li>
        </ol>
        <div class="actions left"><button type="button" class="btn filled" id="obOpen" data-i18n="ob.open"></button><button type="button" class="btn text" id="obDone" data-i18n="ob.done"></button></div>
      </div>
      <details class="sec" open>
        <summary><span data-i18n="sec.save"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="card" id="pathCard">
        <h2 data-i18n="path.title"></h2>
        <p class="muted" data-i18n="path.desc"></p>
        <label class="field">
          <span class="field-label" data-i18n="path.label"></span>
          <input id="saveFolder" type="text" spellcheck="false" autocomplete="off" placeholder="X Media/{username}">
        </label>
        <p class="hint" id="folderHint" aria-live="polite"></p>
        <div class="chips" id="folderChips"></div>
        <div class="preview-line"><span class="muted" data-i18n="path.full"></span><code id="fullPath"></code></div>
      </div>
      <div class="tiles">
        <label class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="ask.title"></span><span class="tile-desc" data-i18n="ask.desc"></span></span>
          <span class="switch"><input type="checkbox" id="askWhere"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span>
        </label>
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="dlset.title"></span><span class="tile-desc" data-i18n="dlset.desc"></span></span>
          <button type="button" class="btn outlined" id="openChromeDl" data-i18n="dlset.btn"></button>
        </div>
      </div>
      </details>
      <details class="sec" open>
        <summary><span data-i18n="sec.name"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="card">
        <h2 data-i18n="file.title"></h2>
        <p class="muted" data-i18n="file.desc"></p>
        <label class="field">
          <span class="field-label" data-i18n="file.template"></span>
          <input id="filenameTemplate" type="text" spellcheck="false" autocomplete="off">
        </label>
        <div class="chips" id="tokenChips"></div>
        <div class="chips-label muted" data-i18n="file.presets"></div>
        <div class="chips" id="presetChips"></div>
        <div class="preview-line"><span class="muted" data-i18n="file.preview"></span><code id="fnPreview"></code></div>
        <div class="try">
          <label class="field"><span class="field-label" data-i18n="file.try"></span>
            <span class="try-row"><input id="tryLink" type="url" placeholder="https://x.com/user/status/…" spellcheck="false" autocomplete="off"><button type="button" class="btn tonal" id="tryBtn" data-i18n="file.tryBtn"></button></span>
          </label>
          <div class="try-out" id="tryOut" aria-live="polite"></div>
        </div>
        <div class="actions"><button class="btn text" id="resetTemplate" data-i18n="file.reset" data-tip-i18n="tip.reset"></button></div>
      </div>
      </details>
      <details class="sec" open>
        <summary><span data-i18n="sec.behavior"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="tiles">
        <label class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="reveal.title"></span><span class="tile-desc" data-i18n="reveal.desc"></span></span>
          <span class="switch"><input type="checkbox" id="autoReveal"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span>
        </label>
        <div class="tile tile-col">
          <span class="tile-text"><span class="tile-title" data-i18n="reveal.keywords"></span><span class="tile-desc" data-i18n="reveal.keywordsDesc"></span></span>
          <label class="field"><input id="revealKeywords" type="text" spellcheck="false" autocomplete="off" placeholder="Ver, Afficher"></label>
        </div>
        <label class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="thumb.title"></span><span class="tile-desc" data-i18n="thumb.desc"></span></span>
          <span class="switch"><input type="checkbox" id="downloadThumbnail"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span>
        </label>
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="multi.title"></span><span class="tile-desc" data-i18n="multi.desc"></span></span>
          <div class="bgroup compact" id="multiMode" role="radiogroup" aria-label="multi">
            <button role="radio" data-value="all" data-i18n="multi.all"></button>
            <button role="radio" data-value="menu" data-i18n="multi.menu"></button>
          </div>
        </div>
      </div>
      </details>
      <details class="sec" open>
        <summary><span data-i18n="sec.shortcut"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="tiles">
        <label class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="sc.title"></span><span class="tile-desc" data-i18n="sc.desc"></span></span>
          <span class="switch"><input type="checkbox" id="shortcutEnabled"><span class="track"><span class="handle"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></span></span>
        </label>
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="sc.current"></span><span class="keys" id="keys"></span></span>
          <button class="btn tonal" id="recordKey" data-i18n="sc.change" data-tip-i18n="tip.record"></button>
        </div>
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="sc.browser"></span><span class="tile-desc" data-i18n="sc.browserDesc"></span></span>
          <button class="btn outlined" id="openShortcuts" data-i18n="sc.open" data-tip-i18n="tip.open"></button>
        </div>
      </div>
      </details>
    </section>

    <!-- APPEARANCE -->
    <section class="pane" id="pane-appearance" role="tabpanel" aria-labelledby="tab-appearance">
      <header class="page-head"><h1 data-i18n="ap.title"></h1><p data-i18n="ap.subtitle"></p></header>

      <div class="card preview" id="previewCard">
        <span class="muted" data-i18n="ap.preview"></span>
        <h3 data-i18n="pv.head"></h3>
        <p data-i18n="pv.body"></p>
        <div class="actions left">
          <button type="button" class="btn filled" data-i18n="pv.filled"></button>
          <button type="button" class="btn tonal" data-i18n="pv.tonal"></button>
          <button type="button" class="btn outlined" data-i18n="pv.outlined"></button>
        </div>
        <div class="mock">
          <div class="mock-av" aria-hidden="true">m</div>
          <div class="mock-main">
            <div class="mock-name"><b data-i18n="pvm.name"></b><span>@minhtrong67</span></div>
            <div class="mock-text" data-i18n="pvm.text"></div>
            <div class="mock-media" aria-hidden="true"></div>
            <div class="mock-bar" aria-hidden="true">
              <span class="mi"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg></span>
              <span class="mi"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>
              <span class="mi"><svg viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></span>
              <span class="mi"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg></span>
              <div class="xmd-wrap"><button type="button" class="xmd-btn" id="mockBtn" aria-label="Download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button></div>
            </div>
          </div>
        </div>
        <p class="muted" data-i18n="pvm.hint"></p>
        <div class="pv-toasts"><span class="muted" data-i18n="pvm.toasts"></span>
          <div class="chips" id="toastDemo">
            <button type="button" class="chip" data-variant="info" data-i18n="lvl.info"></button>
            <button type="button" class="chip" data-variant="success">OK</button>
            <button type="button" class="chip" data-variant="warning" data-i18n="lvl.warning"></button>
            <button type="button" class="chip" data-variant="error" data-i18n="lvl.error"></button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 id="lblMode" data-i18n="ap.mode"></h2>
        <div class="bgroup" id="themeMode" role="radiogroup" aria-labelledby="lblMode">
          <button role="radio" data-value="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="mode.light"></span></button>
          <button role="radio" data-value="dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><span data-i18n="mode.dark"></span></button>
          <button role="radio" data-value="system"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span data-i18n="mode.system"></span></button>
        </div>
      </div>

      <div class="card">
        <h2 id="lblColor" data-i18n="ap.color"></h2>
        <div class="swatches" id="themeColor" role="radiogroup" aria-labelledby="lblColor"></div>
        <p class="muted" id="colorName"></p>
      </div>

      <div class="card">
        <h2 id="lblSize" data-i18n="ap.size"></h2>
        <div class="bgroup" id="fontSize" role="radiogroup" aria-labelledby="lblSize">
          <button role="radio" data-value="small"><span class="sz s" aria-hidden="true">A</span><span data-i18n="size.small"></span></button>
          <button role="radio" data-value="medium"><span class="sz m" aria-hidden="true">A</span><span data-i18n="size.medium"></span></button>
          <button role="radio" data-value="large"><span class="sz l" aria-hidden="true">A</span><span data-i18n="size.large"></span></button>
        </div>
      </div>

      <div class="card">
        <h2 id="lblLang" data-i18n="ap.lang"></h2>
        <div class="bgroup" id="language" role="radiogroup" aria-labelledby="lblLang">
          <button role="radio" data-value="en">English</button>
          <button role="radio" data-value="vi">Tiếng Việt</button>
        </div>
      </div>

      <div class="card">
        <h2 id="lblFont" data-i18n="ap.font"></h2>
        <div class="dd" id="fontDD">
          <button type="button" class="dd-btn" id="fontBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="fontList" aria-labelledby="lblFont fontVal">
            <span class="dd-aa" id="fontAa" aria-hidden="true">Aa</span>
            <span class="dd-val" id="fontVal"></span>
            <svg class="dd-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="dd-list" id="fontList" role="listbox" tabindex="-1" aria-labelledby="lblFont" hidden></ul>
        </div>
      </div>
    </section>

    <!-- ACTIVITY -->
    <section class="pane" id="pane-activity" role="tabpanel" aria-labelledby="tab-activity">
      <header class="page-head"><h1 data-i18n="act.title"></h1><p data-i18n="act.subtitle"></p></header>
      <div class="actions left">
        <button class="btn tonal" id="copyLog" data-i18n="act.copy"></button>
        <button class="btn outlined" id="clearLog" data-i18n="act.clear"></button>
      </div>
      <div class="card empty" id="logEmpty" data-i18n="act.empty"></div>
      <ul class="log" id="logList"></ul>
    </section>

    <!-- ABOUT -->
    <section class="pane" id="pane-about" role="tabpanel" aria-labelledby="tab-about">
      <div class="hero">
        <img src="icons/icon128.png" alt="" width="88" height="88">
        <div>
          <h1>X Media Downloader</h1>
          <p data-i18n="ab.tagline"></p>
          <span class="badge"><span data-i18n="ab.version"></span> <b id="ver"></b></span>
        </div>
      </div>
      <div class="author">
        <div class="author-avatar" aria-hidden="true">m</div>
        <div class="author-text">
          <span class="author-label" data-i18n="ab.author"></span>
          <strong class="author-name">minhtrong67</strong>
          <span class="author-ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></svg><span data-i18n="ab.ai"></span></span>
        </div>
      </div>
      <div class="card"><p data-i18n="ab.desc"></p></div>
      <div class="two">
        <div class="card yes"><h2 data-i18n="ab.does"></h2>
          <ul><li data-i18n="ab.d1"></li><li data-i18n="ab.d2"></li><li data-i18n="ab.d3"></li><li data-i18n="ab.d4"></li></ul></div>
        <div class="card no"><h2 data-i18n="ab.doesnt"></h2>
          <ul><li data-i18n="ab.n1"></li><li data-i18n="ab.n2"></li><li data-i18n="ab.n3"></li></ul></div>
      </div>
      <div class="tiles">
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="bk.export"></span><span class="tile-desc" data-i18n="bk.exportDesc"></span></span>
          <button class="btn tonal" id="exportBtn" data-i18n="bk.exportBtn"></button>
        </div>
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="bk.import"></span><span class="tile-desc" data-i18n="bk.importDesc"></span></span>
          <button class="btn tonal" id="importBtn" data-i18n="bk.importBtn"></button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <div class="tile">
          <span class="tile-text"><span class="tile-title" data-i18n="ab.reset"></span><span class="tile-desc" data-i18n="ab.resetDesc"></span></span>
          <button class="btn outlined" id="resetAll" data-i18n="ab.resetBtn"></button>
        </div>
      </div>
      <div class="card warn"><p data-i18n="ab.race"></p></div>
    </section>
  </main>
</div>
<script src="src/mcu.js"></script>
<script src="src/shared.js"></script>
<script src="src/theme.js"></script>
<script src="options.js"></script>
</body>
</html>
